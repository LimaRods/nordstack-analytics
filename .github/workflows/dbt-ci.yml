name: dbt CI

# Validates a pull request. Builds ONLY what changed plus everything downstream,
# against the dev target. Never writes to production.
#
# Connection settings come from repository variables and secrets -- nothing here is
# hardcoded. See CONNECTION_DETAILS.md.

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'ingestion/**'
      - 'seed_data/**'
      - '.github/workflows/dbt-ci.yml'

concurrency:
  group: dbt-ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        ports:
          - ${{ vars.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s --health-timeout 5s --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - ${{ vars.MYSQL_PORT }}:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      MYSQL_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_PORT: ${{ vars.MYSQL_PORT }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the base branch is needed for state comparison

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # dbt cannot read a warehouse that does not exist. Same sequence a reviewer
      # runs locally, which is the point of keeping it here.
      - name: Bootstrap MySQL source
        run: python ingestion/bootstrap_mysql.py

      - name: Sync MySQL -> PostgreSQL raw
        run: python ingestion/sync_mysql_to_postgres.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # ---------------------------------------------------------------------
      # Baseline: build the BASE branch into the prod target.
      #
      # State comparison needs two things: a manifest to diff against, and real
      # tables for unmodified models to defer to. With no permanent warehouse,
      # building the base branch provides both -- in a database thrown away with
      # the job. In an organisation with a persistent production warehouse this
      # step disappears and --state points at the artifact CD published.
      # ---------------------------------------------------------------------
      - name: Build baseline from ${{ github.base_ref }}
        env:
          DBT_TARGET: prod
        run: |
          git worktree add /tmp/baseline "origin/${{ github.base_ref }}"
          cp -R dbt/dbt_packages /tmp/baseline/dbt/dbt_packages 2>/dev/null || true
          cd /tmp/baseline/dbt
          dbt build --target-path /tmp/baseline-target

      # ---------------------------------------------------------------------
      #   state:modified+   the `+` is the downstream part: a changed staging
      #                     model rebuilds the marts that consume it, so a break
      #                     cannot hide behind an untouched consumer.
      #   --defer --state   unmodified upstream models resolve to the baseline
      #                     instead of being rebuilt.
      #
      # DBT_TARGET is deliberately unset: profiles.yml falls back to dev, so a PR
      # can never write to the production target.
      # ---------------------------------------------------------------------
      - name: Build modified models and their downstream
        working-directory: dbt
        run: |
          dbt build \
            --select "state:modified+" \
            --defer --state /tmp/baseline-target \
            --favor-state

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-${{ github.run_id }}
          path: dbt/target/
          retention-days: 7
