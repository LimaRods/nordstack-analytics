name: dbt CI

# Validates a pull request: builds what changed plus everything downstream, on dev.

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'ingestion/**'
      - 'seed_data/**'
      - 'requirements.txt'
      - '.github/workflows/dbt-ci.yml'

concurrency:
  group: dbt-ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        ports:
          - ${{ vars.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s --health-timeout 5s --health-retries 10

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - ${{ vars.MYSQL_PORT }}:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      MYSQL_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_PORT: ${{ vars.MYSQL_PORT }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap MySQL source
        run: python ingestion/bootstrap_mysql.py

      - name: Sync MySQL -> PostgreSQL raw
        run: python ingestion/sync_mysql_to_postgres.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # State comparison needs a manifest to diff against and real tables to defer to.
      # With a persistent warehouse this step disappears.
      - name: Build baseline from ${{ github.base_ref }}
        run: |
          git worktree add /tmp/baseline "origin/${{ github.base_ref }}"
          cd /tmp/baseline/dbt
          dbt deps
          dbt build --target prod --target-path /tmp/baseline-target

      # The `+` rebuilds downstream models, so a break cannot hide behind an untouched
      # consumer. DBT_TARGET stays unset, so a PR cannot write to production.
      - name: Build modified models and their downstream
        working-directory: dbt
        run: |
          dbt build \
            --select "state:modified+" \
            --defer --state /tmp/baseline-target \
            --favor-state

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-${{ github.run_id }}
          path: dbt/target/
          retention-days: 7
