name: nordstack
version: "1.0.0"
config-version: 2

profile: nordstack

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Materializations reflect current volume (~3.1k rows).
models:
  nordstack:
    staging:
      +materialized: view
    quarantine:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# Raw warns, marts error.
data_tests:
  nordstack:
    staging:
      +severity: error
    marts:
      +severity: error
