name: nordstack
version: "1.0.0"
config-version: 2

profile: nordstack

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Materializations reflect current volume (~3.1k rows). One schema per target rather
# than per layer: the prefix in each model name already says where it sits, so the
# environment boundary stays the only thing a reader has to track.
models:
  nordstack:
    staging:
      +materialized: view
    quarantine:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# Severity encodes where the contract applies: raw warns (the source is expected to be
# dirty), marts error (the published contract must hold).
data_tests:
  nordstack:
    staging:
      +severity: error
    marts:
      +severity: error
