name: nordstack
version: "1.0.0"
config-version: 2

profile: nordstack

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Materializations reflect the current data volume (~3.1k rows), not hypothetical
# scale. See CLAUDE.md section 8. Incremental models are a Next Step, not a default.
models:
  nordstack:
    staging:
      +materialized: view
    quarantine:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# Test severity encodes WHERE the contract applies.
#
# raw sources -> warn. The source is expected to be dirty: these tests exist to make
#   the planted defects visible and counted in every build, not to stop it. Deleting
#   them to get a green build is what CLAUDE.md section 9 forbids.
#
# staging + marts -> error. Staging is the trust boundary. Tests there are scoped to
#   the accepted set (is_valid), so a failure means a defect slipped past quarantine
#   into data the marts are allowed to consume.
data_tests:
  nordstack:
    staging:
      +severity: error
    marts:
      +severity: error
