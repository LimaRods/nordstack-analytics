# Nothing here is assigned literally -- every value is read from the environment, so a
# deployment overrides any setting without editing this file. The fallbacks are the
# local Docker values from the brief, so `dbt debug` works from a clean clone.
#
# `dev` is the default and the only fallback; production selects `prod` explicitly.
# Only one database exists, so the targets separate by SCHEMA, not by database.
#
# dbt auto-loads .env from this directory and its parents, and an already-set variable
# wins over .env -- so do not `source .env`, which would clobber an explicit target.

nordstack:
  target: dev
  outputs:

    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'analytics') }}"
      schema: dev
      threads: 4

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: prod
      threads: 4
