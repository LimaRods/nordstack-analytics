# Local infrastructure: MySQL as the simulated billing source, PostgreSQL as the
# analytics warehouse. Defaults work from a clean clone; override them via .env.

name: nordstack

services:
  postgres:
    image: postgres:16
    container_name: nordstack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbt_user} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: nordstack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billing}
      MYSQL_USER: ${MYSQL_USER:-billing_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-billing_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  mysqldata:
